[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.7.0-beta4", features = ["csr"] }
leptos_router = { version = "0.7.0-beta4" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlTextAreaElement", "Window", "Storage", "FileReader", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Navigator", "Clipboard"] }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
gloo-net = "0.6"
gloo-timers = { version = "0.3.0", features = ["futures"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
