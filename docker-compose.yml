version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    container_name: doopack_traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@dooplo.com.br}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    restart: unless-stopped
    networks:
      - doopack_net

  redis:
    image: redis:7-alpine
    container_name: doopack_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisroot} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisroot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doopack_net

  backend:
    build:
      context: .
      target: backend
    container_name: doopack_backend
    environment:
      - DATABASE_URL=sqlite:///app/data/orchestrator.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisroot}@redis:6379
      - PORT=4500
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doopack_data:/app/data
      - doopack_runtime:/app/services_runtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doopack_net

  frontend:
    build:
      context: .
      target: frontend
    container_name: doopack_frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.doopack-frontend.rule=Host(`pack.dooplo.com.br`)"
      - "traefik.http.routers.doopack-frontend.entrypoints=websecure"
      - "traefik.http.routers.doopack-frontend.tls.certresolver=myresolver"
      - "traefik.http.services.doopack-frontend.loadbalancer.server.port=80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - doopack_net

volumes:
  redis_data:
    name: doopack_redis_data
  doopack_data:
    name: doopack_sqlite_data
  doopack_runtime:
    name: doopack_runtime_data
  traefik_certs:
    name: doopack_traefik_certs

networks:
  doopack_net:
    name: doopack_network
    driver: bridge
