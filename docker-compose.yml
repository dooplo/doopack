version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: doopack_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisroot} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisroot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - doopack_net

  backend:
    build:
      context: .
      target: backend
    container_name: doopack_backend
    environment:
      - DATABASE_URL=sqlite:///app/data/orchestrator.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redisroot}@redis:6379
      - PORT=4500
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doopack_data:/app/data
      - doopack_runtime:/app/services_runtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doopack_net

  frontend:
    build:
      context: .
      target: frontend
    container_name: doopack_frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - doopack_net

volumes:
  redis_data:
    name: doopack_redis_data
  doopack_data:
    name: doopack_sqlite_data
  doopack_runtime:
    name: doopack_runtime_data

networks:
  doopack_net:
    name: doopack_network
    driver: bridge

